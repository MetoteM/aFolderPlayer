name: Publish verified 0.9.14 release
on:
  push:
    branches: [main]
    paths: ['deployment/releases/0.9.14/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;36.0.0'
      - name: Require successful source checks and identical application sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE=$(python3 -c 'import json;print(json.load(open("deployment/releases/0.9.14/manifest.json"))["source_commit"])')
          gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SOURCE" > /tmp/runs.json
          python3 -c 'import json;assert any(r["name"]=="Android checks" and r["conclusion"]=="success" for r in json.load(open("/tmp/runs.json"))["workflow_runs"]),"Source checks are not successful"'
          git diff --exit-code "$SOURCE" HEAD -- app online translator settings.gradle.kts build.gradle.kts tools/build-italian-package.py tools/download-italian-inputs.py tools/inference-test deployment/italian-v1
      - name: Prepare release output
        run: mkdir release-output
      - name: Verify original APK signatures and signed catalogues
        run: |
          python3 tools/publish-release.py release-output "$ANDROID_HOME/build-tools/36.0.0/apksigner" 0.9.14
          cp deployment/releases/0.9.14/catalog-v2.json release-output/
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          python3 - <<'PY'
          import subprocess,json,base64,hashlib,os
          from pathlib import Path
          for name,pkg,code,version in [('aFolderPlayer_0.9.14.apk','dev.alex.folderplayer',72,'0.9.14'),('AFP_Translate_0.3.6.apk','dev.alex.afptranslate',9,'0.3.6'),('AFP_Online_0.2.2.apk','dev.alex.afponline',14,'0.2.2')]:
              info=subprocess.check_output([os.environ['BUILD_TOOLS']+'/aapt','dump','badging','release-output/'+name],text=True)
              assert f"package: name='{pkg}' versionCode='{code}' versionName='{version}'" in info
          for filename,schema in [('catalog.json',1),('catalog-v2.json',2)]:
              payload=json.loads(base64.b64decode(json.loads(Path('release-output',filename).read_text())['payload']))
              assert payload['schema']==schema and payload['version']==16
              for entry in payload['entries']:
                  local=Path('release-output',entry['file'])
                  if local.exists():
                      data=local.read_bytes();assert len(data)==entry['size'] and hashlib.sha256(data).hexdigest()==entry['sha256']
                  else:assert entry['kind']=='model' and any(entry['url'].startswith('https://github.com/MetoteM/aFolderPlayer/releases/download/'+tag+'/') for tag in ['v0.8.0','v0.9.12'])
              assert ('online' in [e['kind'] for e in payload['entries']])==(schema==2)
          PY
          cd release-output
          sha256sum -c SHA256SUMS
          openssl x509 -inform DER -in ../app/src/main/assets/catalog_certificate.der -pubkey -noout > public.pem
          for CATALOG in catalog.json catalog-v2.json; do
            python3 -c 'import json,base64,sys;d=json.load(open(sys.argv[1]));open("payload","wb").write(base64.b64decode(d["payload"]));open("signature","wb").write(base64.b64decode(d["signature"]))' "$CATALOG"
            openssl dgst -sha256 -verify public.pem -signature signature payload
          done
          rm payload signature public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-0.9.14
          path: release-output/
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-0.9.14
          path: release-output
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v0.9.14 --json isDraft --jq '.isDraft' > /tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" != 'true' ]; then
              echo 'Stable release already exists; refusing replacement.'
              exit 0
            fi
          else
            gh release create v0.9.14 --target "$RELEASE_COMMIT" --title 'aFolderPlayer 0.9.14' --notes-file release-output/release-notes.md --draft
          fi
          gh release upload v0.9.14 release-output/aFolderPlayer_0.9.14.apk release-output/AFP_Translate_0.3.6.apk release-output/AFP_Online_0.2.2.apk release-output/catalog.json release-output/catalog-v2.json release-output/SHA256SUMS --clobber
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "v0.9.14" and .draft)' > /tmp/draft-release.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('/tmp/draft-release.json'));assert r['draft'] and not r['prerelease']
          for a in r['assets']:
              p=Path('release-output',a['name'])
              assert p.exists() and a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(r['assets'])==6
          PY
          gh release edit v0.9.14 --draft=false --latest
