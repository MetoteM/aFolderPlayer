name: Android checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deployment/releases/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/release-*.yml'
      - '.github/workflows/artifact-maintenance.yml'
      - 'docs/STORAGE_POLICY.md'
      - 'tools/publish-release.py'
      - 'tools/apk-delta.py'
      - 'docs/GITHUB_RELEASES.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Redirect policy checks
        run: |
          mkdir -p /tmp/http-test
          javac -d /tmp/http-test app/src/main/java/dev/alex/folderplayer/ExtensionHttp.java tools/http-test/dev/alex/folderplayer/ExtensionHttpCheck.java
          java -cp /tmp/http-test dev.alex.folderplayer.ExtensionHttpCheck
      - name: Release checkpoint tests
        run: python3 tools/test_release_checkpoint.py
      - name: Release staging tests
        run: python3 tools/test_stage_player_release.py
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Chinese package and CPU inference
        run: |
          mkdir /tmp/models /tmp/chinese-model /tmp/inference-test
          python3 tools/download-chinese-inputs.py /tmp/models
          python3 tools/build-chinese-package.py /tmp/models /tmp/models/english.zip /tmp/models/chinese.zip
          curl --fail --location --retry 3 -o /tmp/ort.jar https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.20.0/onnxruntime-1.20.0.jar
          curl --fail --location --retry 3 -o /tmp/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          echo 'c46608681692b3693914defb42fa3119ad7cb6146870581ece247e0ed5793fe8  /tmp/ort.jar' | sha256sum -c -
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/json.jar' | sha256sum -c -
          unzip -q /tmp/models/chinese.zip -d /tmp/chinese-model
          javac -cp /tmp/ort.jar:/tmp/json.jar -d /tmp/inference-test translator/src/main/java/dev/alex/folderplayer/OfflineTranslator.java tools/inference-test/dev/alex/folderplayer/ChineseCheck.java
          java -cp /tmp/inference-test:/tmp/ort.jar:/tmp/json.jar dev.alex.folderplayer.ChineseCheck /tmp/chinese-model
      - name: German package and CPU inference
        run: |
          mkdir /tmp/german /tmp/german-model
          python3 tools/download-german-inputs.py /tmp/german
          python3 tools/build-german-package.py /tmp/german /tmp/models/english.zip /tmp/models/german.zip
          unzip -q /tmp/models/german.zip -d /tmp/german-model
          javac -cp /tmp/ort.jar:/tmp/json.jar -d /tmp/inference-test translator/src/main/java/dev/alex/folderplayer/OfflineTranslator.java tools/inference-test/dev/alex/folderplayer/GermanCheck.java
          java -cp /tmp/inference-test:/tmp/ort.jar:/tmp/json.jar dev.alex.folderplayer.GermanCheck /tmp/german-model
      - name: French direct package and CPU inference
        run: |
          mkdir /tmp/french /tmp/french-model
          python3 tools/download-french-inputs.py /tmp/french
          python3 tools/build-french-package.py /tmp/french /tmp/models/french.zip
          unzip -q /tmp/models/french.zip -d /tmp/french-model
          javac -cp /tmp/ort.jar:/tmp/json.jar -d /tmp/inference-test translator/src/main/java/dev/alex/folderplayer/OfflineTranslator.java tools/inference-test/dev/alex/folderplayer/FrenchCheck.java
          /usr/bin/time -v java -Xmx768m -cp /tmp/inference-test:/tmp/ort.jar:/tmp/json.jar dev.alex.folderplayer.FrenchCheck /tmp/french-model
      - name: Build and test
        # Direct French package uses the same production Java decoder, one stage.
        env:
          AFP_MODEL_V2_PACKAGE: /tmp/models/english.zip
          AFP_CHINESE_PACKAGE: /tmp/models/chinese.zip
          AFP_GERMAN_PACKAGE: /tmp/models/german.zip
          AFP_FRENCH_PACKAGE: /tmp/models/french.zip
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :translator:assembleRelease :app:testReleaseUnitTest :translator:testReleaseUnitTest :app:lintRelease :translator:lintRelease --max-workers=2
      - name: Unsigned APKs for local signing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checks-and-unsigned-apks
          path: |
            app/build/outputs/apk/release/
            translator/build/outputs/apk/release/
          retention-days: 1
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            translator/build/reports/
          retention-days: 7
