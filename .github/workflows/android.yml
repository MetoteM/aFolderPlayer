name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Redirect policy checks
        run: |
          mkdir -p /tmp/http-test
          javac -d /tmp/http-test app/src/main/java/dev/alex/folderplayer/ExtensionHttp.java tools/http-test/dev/alex/folderplayer/ExtensionHttpCheck.java
          java -cp /tmp/http-test dev.alex.folderplayer.ExtensionHttpCheck
      - name: Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :translator:assembleRelease :app:testReleaseUnitTest :translator:testReleaseUnitTest :app:lintRelease :translator:lintRelease --max-workers=2
      - name: Reports and unsigned APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checks-and-unsigned-apks
          path: |
            app/build/reports/
            translator/build/reports/
            app/build/outputs/apk/release/
            translator/build/outputs/apk/release/
          retention-days: 7
