name: Integration debug checks
on:
  push:
    branches: ['integration/**']
    paths: ['app/**', 'online/**', 'tools/**', '.github/workflows/integration-checks.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Verify debug integration and read-only probes
        run: |
          python3 -m unittest discover -s tools/yandex-spike -v
          python3 -m unittest discover -s tools/zvuk-spike -v
          bash gradlew --no-daemon :app:assembleDebug :online:assembleDebug :app:testDebugUnitTest :online:testDebugUnitTest :app:lintDebug :online:lintDebug --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-debug-checks
          path: |
            app/build/outputs/apk/debug/
            online/build/outputs/apk/debug/
            app/build/reports/
            online/build/reports/
          retention-days: 7
