name: Yandex Music experiment checks
on:
  push:
    branches: [prerelease/yandex-spike]
    paths: ['app/**', 'online/**', 'tools/yandex-spike/**', '.github/workflows/yandex-spike.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check stage evidence and credential isolation without user accounts
        run: python3 -m unittest discover -s tools/yandex-spike -v
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build integrated player and extension; verify tests and lint
        run: bash gradlew --no-daemon :app:assembleDebug :online:assembleDebug :app:testDebugUnitTest :online:testDebugUnitTest :app:lintDebug :online:lintDebug --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yandex-android-lab
          path: |
            app/build/outputs/apk/
            app/build/reports/
            online/build/outputs/apk/
            online/build/reports/
          retention-days: 7
