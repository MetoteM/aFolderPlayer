name: Publish verified 0.7.0 release
on:
  push:
    branches: [main]
    paths: ['deployment/releases/0.7.0/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Rebuild the pinned model package
        run: |
          curl --fail --location --retry 3 -o /tmp/model-v1.zip https://github.com/MetoteM/aFolderPlayer/releases/download/extensions-v1/AFP_English_Russian_v1.zip
          echo 'a3993652faece02bc5d8f691d2a57498d1df4951e6eaf9ab025cf3a6049e3f6c  /tmp/model-v1.zip' | sha256sum -c -
          mkdir release-output
          python3 tools/build-model-v2.py /tmp/model-v1.zip release-output/AFP_English_Russian_v2.zip
      - name: Build, regression tests and lint
        env:
          AFP_MODEL_V2_PACKAGE: ${{ github.workspace }}/release-output/AFP_English_Russian_v2.zip
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :translator:assembleRelease :app:testReleaseUnitTest :translator:testReleaseUnitTest :app:lintRelease :translator:lintRelease --max-workers=2
          mkdir -p /tmp/http-test
          javac -d /tmp/http-test app/src/main/java/dev/alex/folderplayer/ExtensionHttp.java tools/http-test/dev/alex/folderplayer/ExtensionHttpCheck.java
          java -cp /tmp/http-test dev.alex.folderplayer.ExtensionHttpCheck
      - name: Verify signed release assets
        run: |
          python3 tools/publish-release.py release-output "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cd release-output
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-0.7.0
          path: release-output/
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-0.7.0
          path: release-output
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v0.7.0 --json isDraft --jq '.isDraft' > /tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" != 'true' ]; then
              echo 'Stable release already published; refusing to replace assets.'
              exit 0
            fi
          else
            gh release create v0.7.0 --target "$RELEASE_COMMIT" --title 'aFolderPlayer 0.7.0' --notes-file release-output/release-notes.md --draft
          fi
          gh release upload v0.7.0 release-output/aFolderPlayer_0.7.0.apk release-output/AFP_Translate_0.2.0.apk release-output/AFP_English_Russian_v2.zip release-output/catalog.json release-output/SHA256SUMS --clobber
          gh release edit v0.7.0 --draft=false --latest
