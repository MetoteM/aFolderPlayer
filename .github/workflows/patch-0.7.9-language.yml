name: Publish verified 0.7.9 language patch
on:
  push:
    branches: [main]
    paths: ['deployment/releases/0.7.9/patch1/manifest.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;36.0.0'
      - name: Verify checked source and unchanged application version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE=$(python3 -c 'import json;print(json.load(open("deployment/releases/0.7.9/patch1/manifest.json"))["source_commit"])')
          gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SOURCE" > /tmp/runs.json
          python3 -c 'import json;assert any(r["name"]=="Android checks" and r["conclusion"]=="success" for r in json.load(open("/tmp/runs.json"))["workflow_runs"])'
          git diff --name-only "$SOURCE" HEAD -- app translator > /tmp/changes
          test ! -s /tmp/changes
          mkdir patch-output
          python3 tools/publish-release.py patch-output "$ANDROID_HOME/build-tools/36.0.0/apksigner" 0.7.9/patch1
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging patch-output/aFolderPlayer_0.7.9_patch1.apk > /tmp/badging
          python3 -c 's=open("/tmp/badging").read();assert "package: name="+chr(39)+"dev.alex.folderplayer"+chr(39)+" versionCode="+chr(39)+"35"+chr(39)+" versionName="+chr(39)+"0.7.9"+chr(39) in s'
          cd patch-output
          sha256sum -c SHA256SUMS
          mv SHA256SUMS SHA256SUMS_patch1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-language-patch-079
          path: patch-output/
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-language-patch-079
          path: patch-output
      - name: Add patch without replacing original release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/v0.7.9" > /tmp/release.json
          python3 -c 'import json;d=json.load(open("/tmp/release.json"));assert not d["draft"] and not d["prerelease"];assert "aFolderPlayer_0.7.9.apk" in [a["name"] for a in d["assets"]]'
          for name in aFolderPlayer_0.7.9_patch1.apk SHA256SUMS_patch1; do
            if python3 -c 'import json,sys;sys.exit(0 if sys.argv[1] in [a["name"] for a in json.load(open("/tmp/release.json"))["assets"]] else 1)' "$name"; then
              mkdir -p /tmp/existing
              gh release download v0.7.9 -p "$name" -D /tmp/existing
              cmp "/tmp/existing/$name" "patch-output/$name"
            else
              gh release upload v0.7.9 "patch-output/$name"
            fi
          done
          python3 - <<'PY'
          import json,pathlib
          body=json.load(open('/tmp/release.json'))['body'] or ''
          marker='## Патч 1: язык перевода песни'
          if marker not in body:
              patch=pathlib.Path('patch-output/release-notes.md').read_text()
              body=patch+'\n[Скачать исправленный APK](https://github.com/MetoteM/aFolderPlayer/releases/download/v0.7.9/aFolderPlayer_0.7.9_patch1.apk)\n\n---\n\n'+body
          pathlib.Path('/tmp/notes.md').write_text(body)
          PY
          gh release edit v0.7.9 --notes-file /tmp/notes.md
